<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E7B58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checklist">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Receiving Checklist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column, like a delivery slip. Summary on top, add form, filter tabs, then one row per item with a tick box and a received/ordered counter. */
:root {
  color-scheme: light;
  --bg: #F2F5F3;
  --surface: #FFFFFF;
  --fg: #16201C;
  --muted: #5A6A63;
  --line: #D8E0DC;
  --ok: #1E7B58;
  --ok-soft: #DDF1E8;
  --warn: #A85A05;
  --warn-soft: #FBEBD3;
  --part: #2B6CB0;
  --part-soft: #DFEBF8;
  --danger: #B3261E;
  --on-ok: #FFFFFF;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --surface: #17201C; --fg: #E5EDE9; --muted: #92A39B; --line: #2A3833;
    --ok: #4FC48C; --ok-soft: #173B2D; --warn: #E3A95C; --warn-soft: #3B2A12;
    --part: #7FB4EA; --part-soft: #172B42; --danger: #F2877F; --on-ok: #0C1B14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #17201C; --fg: #E5EDE9; --muted: #92A39B; --line: #2A3833;
  --ok: #4FC48C; --ok-soft: #173B2D; --warn: #E3A95C; --warn-soft: #3B2A12;
  --part: #7FB4EA; --part-soft: #172B42; --danger: #F2877F; --on-ok: #0C1B14;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  margin: 0;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--part); outline-offset: 2px; }

header h1 { font-size: 26px; line-height: 1.15; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); }

.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.headline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.headline .big { font-family: var(--font-num); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.headline .big small { font-size: 15px; color: var(--muted); font-weight: 500; }
.headline .label { color: var(--muted); }
.bar { height: 10px; border-radius: 99px; background: var(--line); display: flex; overflow: hidden; }
.bar i { display: block; height: 100%; transition: width .25s ease; }
.bar .b-ok { background: var(--ok); }
.bar .b-part { background: var(--part); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { color: var(--fg); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.ok { background: var(--ok); } .dot.part { background: var(--part); } .dot.warn { background: var(--warn); }

form.add { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: 1fr 88px 104px; gap: 10px; align-items: end; }
form.add .f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
form.add .f.name { grid-column: 1 / -1; }
form.add label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
form.add input { width: 100%; min-width: 0; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
form.add input[type=number] { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.actions { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; }
.btn { height: 42px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:hover { border-color: var(--muted); }
.btn.primary:hover { border-color: var(--ok); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.tabs button { border: 0; background: transparent; padding: 8px 14px; font-weight: 600; color: var(--muted); border-right: 1px solid var(--line); }
.tabs button:last-child { border-right: 0; }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.tabs .n { font-family: var(--font-num); font-size: 12px; margin-left: 6px; opacity: .8; }
.search { flex: 1 1 160px; min-width: 0; max-width: 260px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "chk main tools" "chk qty qty"; gap: 8px 12px; align-items: center; }
.row.s-received { background: color-mix(in srgb, var(--ok-soft) 55%, var(--surface)); }
.check { grid-area: chk; width: 28px; height: 28px; border-radius: 7px; border: 2px solid var(--muted); background: var(--surface); display: grid; place-items: center; padding: 0; align-self: start; margin-top: 2px; }
.check svg { width: 16px; height: 16px; opacity: 0; stroke: var(--on-ok); }
.check[aria-checked="true"] { background: var(--ok); border-color: var(--ok); }
.check[aria-checked="true"] svg { opacity: 1; }
.main { grid-area: main; min-width: 0; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.s-received .name { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.pill { display: inline-block; margin-top: 3px; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.pill.pending { background: var(--warn-soft); color: var(--warn); }
.pill.partial { background: var(--part-soft); color: var(--part); }
.pill.received { background: var(--ok-soft); color: var(--ok); }
.qty { grid-area: qty; display: flex; align-items: center; gap: 8px; }
.qty .step { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; line-height: 1; padding: 0; }
.qty .step:disabled { opacity: .35; cursor: default; }
.qty .step:not(:disabled):hover { border-color: var(--muted); }
.count { font-family: var(--font-num); font-variant-numeric: tabular-nums; min-width: 0; }
.count b { font-size: 18px; }
.count .of { color: var(--muted); }
.count .unit { color: var(--muted); font-family: var(--font-body); font-size: 13px; margin-left: 4px; }
.tools { grid-area: tools; display: flex; gap: 2px; }
.tools button { border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 6px 8px; border-radius: 6px; }
.tools button:hover { background: var(--bg); color: var(--fg); }
.tools button.confirm { color: var(--danger); font-weight: 600; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty p { margin: 0; max-width: 40ch; text-wrap: balance; }
.status { min-height: 18px; font-size: 13px; color: var(--muted); }
.status.err { color: var(--danger); }

@media (min-width: 600px) {
  form.add { grid-template-columns: 1fr 100px 120px auto; }
  form.add .f.name { grid-column: auto; }
  .actions { grid-column: auto; }
  .row { grid-template-columns: auto minmax(0, 1fr) auto auto; grid-template-areas: "chk main qty tools"; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Receiving Checklist</h1>
    <p>List what you ordered, then tick it off as each item arrives.</p>
  </header>

  <section class="summary" aria-label="Progress" id="summary"></section>

  <form class="add" id="form" autocomplete="off">
    <div class="f name">
      <label for="f-name" id="form-title">Add an item</label>
      <input id="f-name" type="text" placeholder="e.g. A4 paper reams" maxlength="120" required>
    </div>
    <div class="f">
      <label for="f-qty">Quantity</label>
      <input id="f-qty" type="number" inputmode="decimal" min="0.01" step="any" value="1" required>
    </div>
    <div class="f">
      <label for="f-unit">Unit</label>
      <input id="f-unit" type="text" list="units" value="pcs" maxlength="16">
      <datalist id="units"><option value="pcs"><option value="boxes"><option value="packs"><option value="kg"><option value="litres"><option value="sets"><option value="pairs"><option value="dozen"></datalist>
    </div>
    <div class="actions">
      <button class="btn primary" type="submit" id="f-submit">Add item</button>
      <button class="btn" type="button" id="f-cancel" hidden>Cancel</button>
    </div>
  </form>

  <div class="toolbar">
    <div class="tabs" role="group" aria-label="Filter items" id="tabs"></div>
    <input class="search" id="search" type="search" placeholder="Search items" aria-label="Search items">
  </div>

  <ul class="list" id="list"></ul>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  var LS_KEY = 'receiving-checklist-v1';
  var items = [], loaded = false, filter = 'all', query = '', editingId = null, confirmId = null;
  var db = null, chains = {}, statusTimer = null;
  var $ = function (s) { return document.querySelector(s); };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return Number.isInteger(n) ? String(n) : String(+Number(n).toFixed(2)); }
  function statusOf(it) { return it.received <= 0 ? 'pending' : (it.received >= it.qty ? 'received' : 'partial'); }
  var LABEL = { pending: 'Not received', partial: 'Partly received', received: 'Received' };

  function say(msg, isErr) {
    var el = $('#status'); el.textContent = msg; el.className = 'status' + (isErr ? ' err' : '');
    clearTimeout(statusTimer);
    if (msg && !isErr) statusTimer = setTimeout(function () { el.textContent = ''; }, 2500);
  }
  function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch (e) {} }
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; } }
  function body(it) { return { name: it.name, qty: it.qty, unit: it.unit, received: it.received, createdAt: it.createdAt }; }

  /* Writes: one at a time per item, always sending the latest local state. */
  function queue(id, fn) {
    chains[id] = (chains[id] || Promise.resolve()).then(fn).catch(function (e) {
      say('Could not save the last change. You may not have permission to edit this page.', true);
    });
  }
  function save(id) {
    if (!db) { lsSave(); return; }
    queue(id, function () {
      var it = items.find(function (x) { return x.id === id; });
      if (!it) return;
      return db.doc('items/' + id).set(body(it));
    });
  }
  function removeRemote(id) {
    if (!db) { lsSave(); return; }
    queue(id, function () { return db.doc('items/' + id).delete(); });
  }
  function newId() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function addItem(name, qty, unit) {
    var it = { id: newId(), name: name, qty: qty, unit: unit || 'pcs', received: 0, createdAt: Date.now() };
    items.push(it); save(it.id); render();
  }
  function patch(id, p) {
    var it = items.find(function (x) { return x.id === id; });
    if (!it) return;
    Object.assign(it, p); save(id); render();
  }

  function counts() {
    var c = { all: items.length, pending: 0, partial: 0, received: 0 };
    items.forEach(function (it) { c[statusOf(it)]++; });
    c.waiting = c.pending + c.partial;
    return c;
  }

  function renderSummary() {
    var c = counts(), total = c.all;
    var okPct = total ? c.received / total * 100 : 0;
    var partPct = total ? c.partial / total * 100 : 0;
    var headline = total
      ? '<span class="big">' + c.received + '<small> / ' + total + '</small></span><span class="label">' + (c.received === total ? 'Everything has arrived' : 'items fully received') + '</span>'
      : '<span class="label">No items yet</span>';
    $('#summary').innerHTML =
      '<div class="headline">' + headline + '</div>' +
      '<div class="bar" aria-hidden="true"><i class="b-ok" style="width:' + okPct + '%"></i><i class="b-part" style="width:' + partPct + '%"></i></div>' +
      '<div class="legend"><span><i class="dot ok"></i>Received <b>' + c.received + '</b></span><span><i class="dot part"></i>Partly <b>' + c.partial + '</b></span><span><i class="dot warn"></i>Not received <b>' + c.pending + '</b></span></div>';
  }

  function renderTabs() {
    var c = counts();
    var defs = [['all', 'All', c.all], ['waiting', 'Still waiting', c.waiting], ['received', 'Received', c.received]];
    $('#tabs').innerHTML = defs.map(function (d) {
      return '<button type="button" data-filter="' + d[0] + '" aria-pressed="' + (filter === d[0]) + '">' + d[1] + '<span class="n">' + d[2] + '</span></button>';
    }).join('');
  }

  var CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 8.5 6.5 12 13 4.5"/></svg>';

  function renderList() {
    var list = $('#list');
    if (!loaded) { list.innerHTML = '<li class="empty"><p>Loading your items…</p></li>'; return; }
    if (!items.length) {
      list.innerHTML = '<li class="empty"><p>Your checklist is empty. Add the first item above with its quantity, and it will show up here to tick off.</p><button class="btn" type="button" data-act="sample">Load sample items</button></li>';
      return;
    }
    var q = query.trim().toLowerCase();
    var shown = items.filter(function (it) {
      var s = statusOf(it);
      if (filter === 'waiting' && s === 'received') return false;
      if (filter === 'received' && s !== 'received') return false;
      return !q || it.name.toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    if (!shown.length) {
      list.innerHTML = '<li class="empty"><p>' + (q ? 'No items match “' + esc(query) + '”.' : (filter === 'received' ? 'Nothing has been received yet.' : 'Nothing is left to receive.')) + '</p></li>';
      return;
    }
    list.innerHTML = shown.map(function (it) {
      var s = statusOf(it);
      return '<li class="row s-' + s + '" data-id="' + esc(it.id) + '">' +
        '<button class="check" type="button" role="checkbox" aria-checked="' + (s === 'received') + '" aria-label="Mark ' + esc(it.name) + ' as received" data-act="toggle">' + CHECK + '</button>' +
        '<div class="main"><div class="name">' + esc(it.name) + '</div><span class="pill ' + s + '">' + LABEL[s] + '</span></div>' +
        '<div class="qty"><button class="step" type="button" data-act="dec" aria-label="One fewer received"' + (it.received <= 0 ? ' disabled' : '') + '>&minus;</button>' +
        '<span class="count"><b>' + fmt(it.received) + '</b> <span class="of">/ ' + fmt(it.qty) + '</span><span class="unit">' + esc(it.unit) + '</span></span>' +
        '<button class="step" type="button" data-act="inc" aria-label="One more received"' + (it.received >= it.qty ? ' disabled' : '') + '>+</button></div>' +
        '<div class="tools"><button type="button" data-act="edit">Edit</button><button type="button" data-act="del" class="' + (confirmId === it.id ? 'confirm' : '') + '">' + (confirmId === it.id ? 'Delete?' : 'Delete') + '</button></div>' +
        '</li>';
    }).join('');
  }

  function render() { renderSummary(); renderTabs(); renderList(); }

  /* Interactions */
  $('#list').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]'); if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'sample') { loadSample(); return; }
    var row = btn.closest('.row'); if (!row) return;
    var id = row.getAttribute('data-id');
    var it = items.find(function (x) { return x.id === id; }); if (!it) return;
    if (act !== 'del') confirmId = null;
    if (act === 'toggle') patch(id, { received: statusOf(it) === 'received' ? 0 : it.qty });
    else if (act === 'inc') patch(id, { received: Math.min(it.qty, it.received + 1) });
    else if (act === 'dec') patch(id, { received: Math.max(0, it.received - 1) });
    else if (act === 'edit') startEdit(it);
    else if (act === 'del') {
      if (confirmId === id) {
        confirmId = null;
        items = items.filter(function (x) { return x.id !== id; });
        removeRemote(id); render();
      } else {
        confirmId = id; render();
        setTimeout(function () { if (confirmId === id) { confirmId = null; render(); } }, 3000);
      }
    }
  });
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-filter]'); if (!b) return;
    filter = b.getAttribute('data-filter'); render();
  });
  $('#search').addEventListener('input', function (e) { query = e.target.value; renderList(); });

  function startEdit(it) {
    editingId = it.id;
    $('#f-name').value = it.name; $('#f-qty').value = it.qty; $('#f-unit').value = it.unit;
    $('#form-title').textContent = 'Edit item';
    $('#f-submit').textContent = 'Save changes';
    $('#f-cancel').hidden = false;
    $('#f-name').focus(); $('#form').scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  function resetForm() {
    editingId = null; $('#form').reset();
    $('#f-qty').value = 1; $('#f-unit').value = 'pcs';
    $('#form-title').textContent = 'Add an item';
    $('#f-submit').textContent = 'Add item';
    $('#f-cancel').hidden = true;
  }
  $('#f-cancel').addEventListener('click', resetForm);
  $('#form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('#f-name').value.trim();
    var qty = parseFloat($('#f-qty').value);
    var unit = $('#f-unit').value.trim() || 'pcs';
    if (!name || !(qty > 0)) { say('Enter an item name and a quantity above zero.', true); return; }
    if (editingId) {
      var it = items.find(function (x) { return x.id === editingId; });
      if (it) patch(editingId, { name: name, qty: qty, unit: unit, received: Math.min(it.received, qty) });
      say('Item updated.');
    } else {
      addItem(name, qty, unit);
      say('Added “' + name + '”.');
    }
    resetForm();
    if (!editingId) $('#f-name').focus();
  });

  function loadSample() {
    var s = [['A4 paper', 10, 'reams'], ['USB-C cables', 25, 'pcs'], ['Whiteboard markers', 12, 'packs'], ['Desk lamps', 4, 'pcs']];
    var t = Date.now();
    s.forEach(function (r, i) {
      var it = { id: newId(), name: r[0], qty: r[1], unit: r[2], received: 0, createdAt: t + i };
      items.push(it); save(it.id);
    });
    render();
  }

  /* Storage: this browser's localStorage. */
  items = lsLoad(); loaded = true; render();
})();
</script>
</body>
</html>
